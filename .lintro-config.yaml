---
# Lintro Configuration
# https://github.com/lgtm-hq/py-lintro
#
# Lintro is the master configuration source for all tools.
# Native tool configs (.prettierrc, .yamllint, etc.) are used when available.

enforce:
  line_length: 88
  target_python: 'py313'

execution:
  enabled_tools: []
  tool_order: 'priority'
  fail_fast: false

# Fallback configurations for tools without native config files.
# These are used when no native config (e.g., .prettierrc, .yamllint) is found.
defaults:
  prettier:
    semi: true
    singleQuote: true
    tabWidth: 2
    printWidth: 100
    trailingComma: 'es5'
    overrides:
      - files: '*.md'
        options:
          printWidth: 88

  markdownlint:
    MD013:
      line_length: 88
      code_blocks: false
      tables: false

  yamllint:
    extends: 'default'
    rules:
      comments-indentation: 'disable'
      comments:
        min-spaces-from-content: 1
      truthy:
        check-keys: true
      line-length:
        max: 88
        allow-non-breakable-inline-mappings: true

  hadolint:
    ignored: []
    trusted_registries:
      - 'docker.io'
      - 'gcr.io'
      - 'ghcr.io'
      - 'quay.io'
      - 'registry.hub.docker.com'

  mypy:
    strict: true
    ignore_missing_imports: true

# Tool enable/disable settings.
# Full tool configs are in native files (pyproject.toml, .darglint, etc.)
# or in the defaults section above.
tools:
  # Biome - JS/TS linter and formatter (config in biome.json)
  biome:
    enabled: true

  # Ruff - Python linter and formatter (config in pyproject.toml [tool.ruff])
  ruff:
    enabled: true

  # Black - Python formatter (uses enforce.line_length)
  black:
    enabled: true

  # Prettier - Multi-language formatter (defaults above or .prettierrc)
  # Note: JS/TS files are handled by Biome, so exclude them from Prettier
  prettier:
    enabled: true
    exclude:
      - '**/*.ts'
      - '**/*.tsx'
      - '**/*.js'
      - '**/*.jsx'
      - '**/*.mjs'
      - '**/*.cjs'

  # Markdownlint - Markdown linter (defaults above or .markdownlint.yaml)
  markdownlint:
    enabled: true
    exclude:
      - '.bin/**'
      - '.lintro/**'

  # Yamllint - YAML linter (defaults above or .yamllint)
  yamllint:
    enabled: true
    config_source: '.yamllint'
    exclude:
      - '.github/**'
      - '.allstar/**'

  # Bandit - Security linter (config in pyproject.toml [tool.bandit])
  bandit:
    enabled: true

  # html-validate - HTML linting (rules in .htmlvalidate.json)
  #
  # Scope: the hand-authored `.html` documents under `examples/` plus the two
  # CI report templates in `scripts/ci/templates/`. Vue single-file components
  # are out of scope.
  #
  # Why Vue SFCs are out of scope: html-validate parses `.vue` files as raw
  # HTML, so every SFC feature reads as a defect — `<Card>` is reported as an
  # invalid element name and a lowercase violation, and `<slot />` / `<div />`
  # as illegal self-closing tags. Making them pass would need a Vue-aware
  # transform that the pinned py-lintro image does not ship. Vue templates are
  # already checked by `@vue/compiler-sfc` during `bun run build`, so nothing
  # goes unchecked. lintro always hands html-validate the discovered `.vue`
  # files, so the exclusion is declared where html-validate itself resolves it:
  # `examples/vue/src/.htmlvalidate.json` and
  # `examples/stackblitz/vue/src/.htmlvalidate.json` set `root: true` with an
  # empty rule set, which stops config inheritance for those directories.
  #
  # Rule policy (see .htmlvalidate.json):
  # - `void-style` is set to `selfclosing`, and `doctype-style` to `lowercase`,
  #   because Prettier is this repo's authoritative HTML formatter and emits
  #   `<meta charset="utf-8" />` and `<!doctype html>`. The defaults of both
  #   rules contradict that output, so leaving them at default would make
  #   `lintro fmt` and `lintro chk` permanently disagree. Formatting authority
  #   stays with Prettier; html-validate keeps the correctness rules.
  # - Every other `html-validate:recommended` rule is left at its default and
  #   the sources were fixed instead: duplicate attributes, implicit button
  #   types, a missing password `autocomplete`, and an inline style.
  html_validate:
    enabled: true

  # Hadolint - Dockerfile linter (defaults above or .hadolint.yaml)
  hadolint:
    enabled: true

  # Actionlint - GitHub Actions linter
  actionlint:
    enabled: true

  # Darglint - Docstring linter (config in .darglint)
  darglint:
    enabled: true

  # Pytest - Test runner (config in pyproject.toml [tool.pytest.ini_options])
  pytest:
    enabled: true

  # Semgrep - Security scanner (uses .semgrepignore for exclusions)
  semgrep:
    enabled: true

  # tsc - disabled: lintro's tsc wrapper ignores tool-level excludes and
  # generates a temp tsconfig that includes all .ts files, breaking against
  # rootDir in monorepos. Filed as lgtm-hq/py-lintro#803.
  # TypeScript is type-checked via `bun run build` (uses project tsconfigs).
  tsc:
    enabled: false

  # vue-tsc - Vue files only exist in examples/vue (has own tsconfig).
  # lintro's vue-tsc invocation conflicts with TS 5.9 (TS5112: can't pass
  # files + tsconfig together). Root project has no Vue source to check.
  vue-tsc:
    enabled: false

  # OSV-Scanner - Multi-ecosystem dependency vulnerability scanner
  # Scans lockfiles (bun.lock, package-lock.json) against the OSV database
  # Config and suppressions in .osv-scanner.toml
  osv_scanner:
    enabled: true
