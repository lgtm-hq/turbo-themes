---
name: Publish - npm

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g., v0.11.0)'
        required: true
        type: string
        default: 'latest'
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: publish-npm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Uses trust-and-skip pattern: tag already validated in PR workflow.
  # Report mode generates a CycloneDX SBOM plus a signed provenance
  # attestation via the org lgtm-ci reusable (replaces the former local
  # reusable-sbom.yml). Multi-format signed release-asset SBOMs are produced
  # separately by release-publish-pr.yml (reusable-sbom release-assets mode).
  sbom:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-sbom.yml@ee8484ca71db3a2c2c33da6128bbf2330fcd7c88 # v0.59.2
    with:
      job-name: '📋 Generate & Sign SBOM'
      target: .
      target-type: dir
      scan-vulnerabilities: false
      create-attestation: true
      tooling-ref: 'ee8484ca71db3a2c2c33da6128bbf2330fcd7c88' # v0.59.2
      egress-policy: block
      egress-preset: sbom
    permissions:
      contents: write
      security-events: write
      id-token: write
      attestations: write

  build:
    name: 🔨 Build npm Package
    needs: [sbom]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      package-version: ${{ steps.pkg-info.outputs.version }}
      package-name: ${{ steps.pkg-info.outputs.name }}
    steps:
      - name: Harden Runner
        if: ${{ !env.ACT }}
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            bun.sh:443
            codeload.github.com:443
            github.com:443
            npmjs.org:443
            objects.githubusercontent.com:443
            pkg-containers.githubusercontent.com:443
            pipelines.actions.githubusercontent.com:443
            registry.npmjs.org:443
            release-assets.githubusercontent.com:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate version sync
        run: ./scripts/ci/validate-version-sync.sh

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build package
        run: bun run build

      - name: Build theme CSS
        run: bun run build:themes

      - name: Extract package information
        id: pkg-info
        run: |
          echo "version=$(jq -r '.version' package.json)" >> "$GITHUB_OUTPUT"
          echo "name=$(jq -r '.name' package.json)" >> "$GITHUB_OUTPUT"

      - name: Run tests
        run: bun run test

      - name: Generate SHA256 checksum
        id: checksum
        run: ./scripts/ci/generate-npm-checksum.sh

      - name: Upload package artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package-${{ steps.pkg-info.outputs.version }}
          path: '*.tgz'
          retention-days: 90
          if-no-files-found: error

      - name: Build summary
        run: |
          {
            echo "## 📦 npm Package Built"
            echo ""
            echo "| Property | Value |"
            echo "|----------|-------|"
            echo "| Package | \`${{ steps.pkg-info.outputs.name }}\` |"
            echo "| Version | \`${{ steps.pkg-info.outputs.version }}\` |"
            echo "| SHA256 | \`${{ steps.checksum.outputs.sha256 }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: 📦 Publish to npm
    needs: [build]
    # Must use GitHub-hosted runner for npm provenance attestation (sigstore)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    environment:
      name: npm
      url: https://www.npmjs.com/package/${{ needs.build.outputs.package-name }}
    steps:
      - name: Harden Runner
        if: ${{ !env.ACT }}
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            codeload.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            pkg-containers.githubusercontent.com:443
            registry.npmjs.org:443
            fulcio.sigstore.dev:443
            rekor.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download package artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package-${{ needs.build.outputs.package-version }}
          path: .

      - name: Setup Node.js for npm publish
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org

      - name: Publish to npm (OIDC)
        run: npm publish ./*.tgz --access public --provenance

      - name: Summary
        run: |
          {
            echo "## 🚀 Published to npm"
            echo ""
            echo "| Property | Value |"
            echo "|----------|-------|"
            echo "| Package | [${{ needs.build.outputs.package-name }}](https://www.npmjs.com/package/${{ needs.build.outputs.package-name }}) |"
            echo "| Version | \`${{ needs.build.outputs.package-version }}\` |"
            echo "| Registry | [npmjs.org](https://registry.npmjs.org) |"
            echo ""
            echo "### Install"
            echo "\`\`\`bash"
            echo "npm install ${{ needs.build.outputs.package-name }}@${{ needs.build.outputs.package-version }}"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"
