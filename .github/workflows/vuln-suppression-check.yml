---
name: Vulnerability Suppression Check

on:
  schedule:
    # Weekly on Monday at 04:00 UTC
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions: {}

jobs:
  check-suppressions:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-vuln-suppression-check.yml@d32388495d571a0ee13383bacc732765bf4e9e7d  # v0.74.6
    with:
      job-name: '🔍 Suppression Staleness Check'
      workflow-file: vuln-suppression-check.yml
      runner-image: ubuntu-24.04
      tooling-ref: 'd32388495d571a0ee13383bacc732765bf4e9e7d'  # v0.74.6
      egress-policy: block
      egress-preset: osv-scanner
    permissions:
      contents: write
      pull-requests: write
    secrets:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
