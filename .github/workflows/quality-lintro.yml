---
name: Quality - Lint & Format

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions: {}

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Org ruleset (checks-turbo-themes): quality / 🛠️ Lintro Code Quality
  quality:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-quality-lint.yml@b777111fb3aaa6f09589fb029f0094a05dd76003  # v0.77.7
    with:
      job-name: '🛠️ Lintro Code Quality'
      # py-lintro 0.163.0 pinned to immutable digest for reproducibility
      # yamllint disable-line rule:line-length
      lintro-image: ghcr.io/lgtm-hq/py-lintro:0.171.3@sha256:f7c3b4a5f9447ce12879c4b92f3ec7097aa480c925a44a04bc5358dfd70237ed
      runner-image: ubuntu-24.04
      tooling-ref: 'b777111fb3aaa6f09589fb029f0094a05dd76003' # v0.77.7
      egress-policy: audit # TEMP: lgtm-hq/lgtm-ci#1207
      egress-preset: quality
    permissions:
      contents: read
      # pull the pinned ghcr.io/lgtm-hq/py-lintro image
      packages: read

  publish-quality-summary:
    needs: quality
    if: >-
      !cancelled()
      && github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.fork == false
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-publish-quality-summary.yml@b777111fb3aaa6f09589fb029f0094a05dd76003  # v0.77.7
    with:
      exit-code: ${{ needs.quality.outputs.exit-code }}
      runner-image: ubuntu-24.04
      tooling-ref: 'b777111fb3aaa6f09589fb029f0094a05dd76003' # v0.77.7
      egress-policy: audit # TEMP: lgtm-hq/lgtm-ci#1207
      egress-preset: github-minimal
    permissions:
      contents: read
      pull-requests: write
