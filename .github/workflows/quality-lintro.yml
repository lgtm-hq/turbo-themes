---
name: Quality - Lint & Format

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions: {}

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Org ruleset (checks-turbo-themes): quality / 🛠️ Lintro Code Quality
  quality:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-quality-lint.yml@f0e999fd9934a43c8d1d6a1c68ee2d1a8a978f36 # v0.69.8
    with:
      job-name: '🛠️ Lintro Code Quality'
      # py-lintro 0.163.0 pinned to immutable digest for reproducibility
      # yamllint disable-line rule:line-length
      lintro-image: ghcr.io/lgtm-hq/py-lintro:0.163.0@sha256:1f341ff811e4083bebd19e641ec52bfa5e8d101f4659f0e3054be3f5a0cffb81
      runner-image: ubuntu-24.04
      tooling-ref: 'f0e999fd9934a43c8d1d6a1c68ee2d1a8a978f36' # v0.69.8
      egress-policy: block
      egress-preset: quality
    permissions:
      contents: read
      # pull the pinned ghcr.io/lgtm-hq/py-lintro image
      packages: read

  publish-quality-summary:
    needs: quality
    if: >-
      !cancelled()
      && github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.fork == false
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-publish-quality-summary.yml@f0e999fd9934a43c8d1d6a1c68ee2d1a8a978f36 # v0.69.8
    with:
      exit-code: ${{ needs.quality.outputs.exit-code }}
      runner-image: ubuntu-24.04
      tooling-ref: 'f0e999fd9934a43c8d1d6a1c68ee2d1a8a978f36' # v0.69.8
      egress-policy: block
      egress-preset: github-minimal
    permissions:
      contents: read
      pull-requests: write
