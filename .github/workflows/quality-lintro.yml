---
name: Quality - Lint & Format

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions: {}

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Org ruleset (checks-turbo-themes): quality / 🛠️ Lintro Code Quality
  quality:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-quality-lint.yml@f57b4d014f82d7f5996c7b339f1b2ca681780921 # v0.69.4
    with:
      job-name: '🛠️ Lintro Code Quality'
      # py-lintro 0.91.49 pinned to immutable digest for reproducibility
      # yamllint disable-line rule:line-length
      lintro-image: ghcr.io/lgtm-hq/py-lintro:0.91.49@sha256:268e9a5c3c09998c4e42f59309fe47de74bb1dc8e0a7f6d4e88cf07a7cb1d738
      runner-image: ubuntu-24.04
      tooling-ref: 'f57b4d014f82d7f5996c7b339f1b2ca681780921' # v0.69.4
      egress-policy: block
      egress-preset: quality
    permissions:
      contents: read
      # pull the pinned ghcr.io/lgtm-hq/py-lintro image
      packages: read

  publish-quality-summary:
    needs: quality
    if: >-
      !cancelled()
      && github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.fork == false
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-publish-quality-summary.yml@f57b4d014f82d7f5996c7b339f1b2ca681780921 # v0.69.4
    with:
      exit-code: ${{ needs.quality.outputs.exit-code }}
      runner-image: ubuntu-24.04
      tooling-ref: 'f57b4d014f82d7f5996c7b339f1b2ca681780921' # v0.69.4
      egress-policy: block
      egress-preset: github-minimal
    permissions:
      contents: read
      pull-requests: write
