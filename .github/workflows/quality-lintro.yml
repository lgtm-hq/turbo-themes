---
name: Quality - Lint & Format

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions: {}

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Org ruleset (checks-turbo-themes): quality / 🛠️ Lintro Code Quality
  quality:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-quality-lint.yml@0c373f1252e0fe23a1e119df639b51d63b02b7d8 # v0.116.3
    with:
      job-name: '🛠️ Lintro Code Quality'
      # py-lintro 0.163.0 pinned to immutable digest for reproducibility
      # yamllint disable-line rule:line-length
      lintro-image: ghcr.io/lgtm-hq/py-lintro:0.178.1@sha256:9f7510d65d063e2f0f1bdccb2b8f486d744ba21753341e75e5bbd8c9b29a9aae
      runner-image: ubuntu-26.04
      tooling-ref: '0c373f1252e0fe23a1e119df639b51d63b02b7d8' # v0.116.3
      egress-policy: block
      egress-preset: quality
    permissions:
      contents: read
      # pull the pinned ghcr.io/lgtm-hq/py-lintro image
      packages: read

  publish-quality-summary:
    needs: quality
    if: >-
      !cancelled()
      && github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.fork == false
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-publish-quality-summary.yml@0c373f1252e0fe23a1e119df639b51d63b02b7d8 # v0.116.3
    with:
      exit-code: ${{ needs.quality.outputs.exit-code }}
      runner-image: ubuntu-26.04
      tooling-ref: '0c373f1252e0fe23a1e119df639b51d63b02b7d8' # v0.116.3
      egress-policy: block
      egress-preset: github-minimal
    permissions:
      contents: read
      pull-requests: write
