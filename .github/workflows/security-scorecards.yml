---
name: Security - OpenSSF Scorecard Analysis

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: scorecard
  cancel-in-progress: false

jobs:
  # Not a required check in checks-turbo-themes; no ruleset lockstep needed.
  scorecards:
    # lgtm-ci owns the scorecard scan; this repo stays a thin caller.
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-scorecards.yml@9ea778eb4e6b876d60b7b3d7d0d0aee5182717bb  # v0.78.0
    with:
      job-name: '🏆 OpenSSF Scorecard'
      # Re-enabled at v0.52.4: the reusable job now contains only
      # publish-allowlisted actions (lgtm-ci#518).
      publish-results: true
      egress-policy: block
      # lgtm-ci v0.77 re-added egress-preset (default scorecard) with
      # allowed-endpoints-mode replace (default), so this non-empty list is
      # used alone by the harden-runner pre hook, as before.
      # It covers the reusable's default baseline plus the
      # StepSecurity/sigstore/OSSF hosts this job needs for publish.
      allowed-endpoints: >
        github.com:443
        api.github.com:443
        codeload.github.com:443
        objects.githubusercontent.com:443
        raw.githubusercontent.com:443
        pipelines.actions.githubusercontent.com:443
        gcr.io:443
        api.osv.dev:443
        api.scorecard.dev:443
        api.securityscorecards.dev:443
        agent.api.stepsecurity.io:443
        fulcio.sigstore.dev:443
        rekor.sigstore.dev:443
        sigstore.dev:443
        tuf-repo-cdn.sigstore.dev:443
        release-assets.githubusercontent.com:443
        oss-fuzz-build-logs.storage.googleapis.com:443
        ossf.github.io:443
        www.bestpractices.dev:443
    permissions:
      # Elevated only where the reusable scorecards job requires: publish the
      # SARIF to the Security tab (security-events) and sign results via OIDC
      # (id-token). Everything else stays contents: read.
      contents: read
      security-events: write
      id-token: write
