---
name: Quality Check - Action Pinning Validation

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions: {}

concurrency:
  group: action-pinning-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-validate-action-pinning.yml@86e29ba560701a8d73f31713eb0841ef50f6029c # v0.74.5
    with:
      runner-image: ubuntu-24.04
      tooling-ref: '86e29ba560701a8d73f31713eb0841ef50f6029c' # v0.74.5
      egress-policy: block
      egress-preset: github-tooling
    permissions:
      contents: read
