---
name: Quality Check - Action Pinning Validation

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions: {}

concurrency:
  group: action-pinning-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-validate-action-pinning.yml@d32388495d571a0ee13383bacc732765bf4e9e7d # v0.74.6
    with:
      runner-image: ubuntu-24.04
      tooling-ref: 'd32388495d571a0ee13383bacc732765bf4e9e7d' # v0.74.6
      egress-policy: block
      egress-preset: github-tooling
    permissions:
      contents: read
