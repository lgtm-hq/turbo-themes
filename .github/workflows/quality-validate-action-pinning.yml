---
name: Quality Check - Action Pinning Validation

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions: {}

concurrency:
  group: action-pinning-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-validate-action-pinning.yml@b830ca6972f0c9cbaeb1363283de594f68d66acf # v0.87.0
    with:
      runner-image: ubuntu-26.04
      tooling-ref: 'b830ca6972f0c9cbaeb1363283de594f68d66acf' # v0.87.0
      egress-policy: block
      egress-preset: github-tooling
    permissions:
      contents: read
