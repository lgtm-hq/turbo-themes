# SPDX-License-Identifier: MIT
---
name: PR - Auto Assign

# Automatically assigns a random CODEOWNER to new pull requests.
# Ensures every PR has an assignee for accountability.

'on':
  pull_request_target:
    types: [opened, labeled]

permissions: {}

concurrency:
  group: pr-auto-assign-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  assign:
    # Skip release-bump PRs — release-version-pr.yml requests CODEOWNER review directly.
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'release-bump') }}
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-pr-auto-assign.yml@d32388495d571a0ee13383bacc732765bf4e9e7d # v0.74.6
    with:
      codeowners-path: .github/CODEOWNERS
      job-name: '👤 Auto Assign CODEOWNER'
      runner-image: ubuntu-24.04
      tooling-ref: 'd32388495d571a0ee13383bacc732765bf4e9e7d' # v0.74.6
      egress-policy: block
      egress-preset: github-tooling
    permissions:
      contents: read
      # the reusable assigns a random CODEOWNER to the pull request
      pull-requests: write
