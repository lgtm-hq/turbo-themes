---
name: Release - Publish PR

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g., v1.2.3)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Note: npm, PyPI, and RubyGems publishing are handled by separate workflows
  # (publish-npm.yml, publish-python.yml, publish-gem.yml) triggered on tag push

  github-release:
    name: 🚀 Create GitHub Release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            pkg-containers.githubusercontent.com:443
            uploads.github.com:443

      - name: Create GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          token: ${{ steps.app-token.outputs.token }}
          # On workflow_dispatch github.ref is a branch; the release must
          # target the dispatched tag instead (#725).
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          body: |
            ## 📦 @turbocoder13/turbo-themes ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

            Published to npm: https://www.npmjs.com/package/@turbocoder13/turbo-themes

            ### 📋 Software Bill of Materials (SBOM)

            Signed SBOM files are attached to this release by the SBOM job
            immediately after publish (allow a few minutes for the assets to
            appear), in multiple formats:
            - **CycloneDX JSON**: `sbom.cyclonedx.json` (+ signature bundle)
            - **SPDX JSON**: `sbom.spdx.json` (+ signature bundle)
            - **CycloneDX XML**: `sbom.cyclonedx.xml` (+ signature bundle)

            All SBOM files are signed using [Sigstore](https://www.sigstore.dev/) keyless signing.

            ### 🔒 Security

            - All SBOM files are cryptographically signed
            - npm package includes [provenance attestation](https://docs.npmjs.com/generating-provenance-statements)
            - View [OpenSSF Scorecard](https://scorecard.dev/) for security metrics
          draft: false
          prerelease: false
          generate_release_notes: true

      - name: Summary
        shell: bash
        run: |
          {
            echo "## GitHub Release Summary"
            echo "✅ Release ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }} published and released"
          } >> "$GITHUB_STEP_SUMMARY"

  # Generate multi-format SBOMs at the release tag, cosign-sign them, and
  # attach them to the release created above (lgtm-ci reusable-sbom.yml
  # release-assets mode; lgtm-ci#520).
  sbom:
    needs: [github-release]
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-sbom.yml@86e29ba560701a8d73f31713eb0841ef50f6029c # v0.74.5
    with:
      mode: release-assets
      job-name: '📋 Generate & Sign SBOM'
      target: .
      target-type: dir
      formats: 'spdx-json,cyclonedx-json,cyclonedx-xml'
      sign: true
      release-tag: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      tooling-ref: '86e29ba560701a8d73f31713eb0841ef50f6029c' # v0.74.5
      egress-policy: block
      egress-preset: sbom
    permissions:
      contents: write
      id-token: write
      # Static validation requires granting everything ANY callee job requests,
      # even jobs skipped in release-assets mode (scan/attest); missing these
      # startup-failed every tag run since v0.25.0 (#720).
      security-events: write
      attestations: write
