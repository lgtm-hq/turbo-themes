---
name: Security - SBOM Generation

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
  merge_group:
    types: [checks_requested]

permissions: {}

concurrency:
  group: sbom-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Org ruleset (checks-turbo-themes): sbom / 📋 SBOM & Supply Chain
  # Release-asset SBOMs (multi-format + cosign signatures) are produced by the
  # lgtm-ci reusable-sbom.yml release-assets mode in release-publish-pr.yml.
  # The publish-* workflows also call the org lgtm-ci reusable-sbom.yml
  # (report mode); the former local reusable-sbom.yml has been removed.
  sbom:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-sbom.yml@f57b4d014f82d7f5996c7b339f1b2ca681780921 # v0.69.4
    with:
      job-name: '📋 SBOM & Supply Chain'
      target: .
      target-type: dir
      sbom-format: cyclonedx-json
      scan-vulnerabilities: true
      # Advisory-only: empty string is the documented sentinel in
      # reusable-sbom.yml for disabling the severity gate entirely (not a
      # severity level — valid levels are critical/high/medium/low/none).
      # Pre-migration posture preserved — the hand-rolled SBOM job never
      # gated on scan findings. Default in v0.59 is critical; revisit once
      # the vulnerability baseline is clean.
      fail-on-severity: ''
      create-attestation: true
      runner-image: ubuntu-24.04
      tooling-ref: 'f57b4d014f82d7f5996c7b339f1b2ca681780921' # v0.69.4
      egress-policy: block
      egress-preset: sbom
    permissions:
      contents: write
      security-events: write
      id-token: write
      attestations: write
