---
name: Publish - Ruby Gem

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g., v0.4.0)'
        required: true
        type: string
        default: 'latest'
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: publish-gem-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Uses trust-and-skip pattern: tag already validated in PR workflow.
  # Report mode generates a CycloneDX SBOM plus a signed provenance
  # attestation via the org lgtm-ci reusable (replaces the former local
  # reusable-sbom.yml). Multi-format signed release-asset SBOMs are produced
  # separately by release-publish-pr.yml (reusable-sbom release-assets mode).
  sbom:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-sbom.yml@ee8484ca71db3a2c2c33da6128bbf2330fcd7c88 # v0.59.2
    with:
      job-name: '📋 Generate & Sign SBOM'
      target: .
      target-type: dir
      scan-vulnerabilities: false
      create-attestation: true
      tooling-ref: 'ee8484ca71db3a2c2c33da6128bbf2330fcd7c88' # v0.59.2
      egress-policy: block
      egress-preset: sbom
    permissions:
      contents: write
      security-events: write
      id-token: write
      attestations: write

  build:
    name: 🔨 Build Gem Package
    needs: [sbom]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      gem-version: ${{ steps.gem-info.outputs.version }}
      gem-name: ${{ steps.gem-info.outputs.name }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            pkg-containers.githubusercontent.com:443
            codeload.github.com:443
            release-assets.githubusercontent.com:443
            pipelines.actions.githubusercontent.com:443
            registry.npmjs.org:443
            npmjs.org:443
            bun.sh:443
            cache.ruby-lang.org:443
            rubygems-downloads.global.ssl.fastly.net:443
            rubygems.org:443
            api.rubygems.org:443
            index.rubygems.org:443
            bundler.rubygems.org:443
            rubygems.global.ssl.fastly.net:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate version sync
        run: ./scripts/ci/validate-version-sync.sh

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Setup Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '4.0.6'
          bundler-cache: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build npm package
        run: bun run build

      - name: Build theme CSS files
        run: bun run build:themes

      - name: Build gem package
        run: bun run build:gem

      - name: Extract gem information
        id: gem-info
        run: ./scripts/ci/extract-gem-info.sh

      - name: Verify gem package
        run: ./scripts/ci/verify-gem-package.sh ${{ steps.gem-info.outputs.path }}

      - name: Run tests against built package
        run: bun run test

      - name: Generate SHA256 checksum
        id: checksum
        run: ./scripts/ci/generate-checksum.sh ${{ steps.gem-info.outputs.path }}

      - name: Upload gem artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gem-package-${{ steps.gem-info.outputs.version }}
          path: ${{ steps.gem-info.outputs.path }}
          retention-days: 90
          if-no-files-found: error

      - name: Build summary
        run: ./scripts/ci/build-summary.sh "${{ steps.gem-info.outputs.name }}" "${{ steps.gem-info.outputs.version }}" "${{ steps.checksum.outputs.sha256 }}"

  publish:
    name: 📦 Publish to RubyGems
    needs: [build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    environment:
      name: rubygems
      url: https://rubygems.org/gems/turbo-themes
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            pkg-containers.githubusercontent.com:443
            codeload.github.com:443
            release-assets.githubusercontent.com:443
            cache.ruby-lang.org:443
            rubygems-downloads.global.ssl.fastly.net:443
            rubygems.org:443
            api.rubygems.org:443
            index.rubygems.org:443
            bundler.rubygems.org:443
            rubygems.global.ssl.fastly.net:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download gem artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: gem-package-${{ needs.build.outputs.gem-version }}
          path: .

      - name: Verify artifact integrity
        run: ./scripts/ci/verify-artifact.sh

      - name: Setup Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '4.0.6'

      - name: Configure RubyGems credentials
        uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0
        with:
          role-to-assume: ${{ secrets.RUBYGEMS_OIDC_ROLE }}

      - name: Publish to RubyGems
        run: ./scripts/ci/publish-gem.sh

      - name: Summary
        run: ./scripts/ci/publish-summary.sh "${{ needs.build.outputs.gem-version }}" "${{ needs.build.outputs.gem-name }}"
