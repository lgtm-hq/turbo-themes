[project]
name = "turbo-themes-workspace"
version = "0.1.0"
requires-python = ">=3.11"

[dependency-groups]
dev = [
  "lintro==0.171.1",
  "pytest>=9.0,<10.0",
  "assertpy>=1.1",
  # Formatters/linters lintro drives. Pinned at or above lintro 0.91.9's
  # minimums so lintro never silently skips them for being too old.
  "black>=26.3.1",
  "ruff>=0.15.9",
]

[tool.black]
line-length = 88
extend-exclude = '''
(
    python/src/turbo_themes/themes\.py
    | python/src/turbo_themes/generated/.*
)
'''

[tool.ruff]
extend-exclude = [
  "python/src/turbo_themes/themes.py",
  "python/src/turbo_themes/generated/*",
  # Exclude files where black is the authoritative formatter
  "python/src/turbo_themes/mapping_config.py",
  "python/tests/test_css_variables.py",
  # Also exclude with relative paths for lintro python directory
  "**/mapping_config.py",
  "**/test_css_variables.py",
]
line-length = 88

[tool.ruff.format]
quote-style = "double"

[tool.lintro]
exclude = [
  "_site/",
  "**/vendor/",
  "vendor/",
  ".pytest_cache/",
  "node_modules/",
  "coverage/",
  "dist/",
  "playwright-report/",
  "test-results/",
  ".lintro/",
  "**/.build/",
  ".husky/**",
  ".lgtm-ci-tooling/",
  "python/src/turbo_themes/generated/",
  "apps/site/src/content/api/",
]

[tool.lintro.tool.semgrep]
# Exclude test/benchmark/e2e files where security audit rules produce false positives
# These files use dynamic patterns for test assertions which trigger false positives
exclude = [
  "benchmarks/",
  "e2e/",
  "test/",
  "examples/test-utils/",
  "examples/bootstrap/test/",
  "packages/css/test/",
]

[tool.lintro.tool.black]
exclude = [
  "python/src/turbo_themes/generated/*",
  "src/turbo_themes/generated/*",
]

[tool.lintro.tool.ruff]
exclude = [
  "python/src/turbo_themes/generated/*",
  "src/turbo_themes/generated/*",
  # Exclude files where black is the authoritative formatter (lintro runs from python/)
  "src/turbo_themes/mapping_config.py",
  "tests/test_css_variables.py",
]

[tool.lintro.tool.markdownlint]
# Exclude TypeDoc-generated API reference (auto-generated, gitignored, not hand-authored)
exclude = ["apps/site/src/content/api/**"]

[tool.lintro.tool.hadolint]
exclude = ["_site/Dockerfile"]

[tool.lintro.tool.shellcheck]
# Exclude husky-generated files (they don't have shebangs by design)
exclude = [".husky/**"]

[tool.lintro.tool.shfmt]
# Exclude husky-generated files
exclude = [".husky/"]

[tool.lintro.tool.actionlint]
exclude = ["**/vendor/**"]

[tool.bandit]
# Skip B101 (assert) - standard in test files
# Skip B105/B106 - false positives on design token paths (e.g., 'background.base')
skips = ["B101", "B105", "B106"]

[tool.lintro.tool.bandit]
# Use native bandit config from [tool.bandit]


[tool.lintro.tool.yamllint]
exclude = [".github/workflows/**", ".github/actions/**", ".allstar/**"]

[tool.lintro.tool.pylint]
# Generated token modules (quicktype output) are excluded like the other
# generated paths: long generated font-family strings and the width of the
# generated dataclass are inherent to the generated contract, and the files
# are regenerated rather than hand-edited.
exclude = [
  "python/src/turbo_themes/generated/*",
  "src/turbo_themes/generated/*",
]

[tool.pylint.typecheck]
# assertpy is a pytest-time dev dependency that the pinned lintro lint image
# does not install; import-error stays enabled for every other module.
ignored-modules = ["assertpy"]

[tool.pylint.design]
# Tokens (python/src/turbo_themes/models.py) is a published type whose
# declared fields mirror the theme token-category contract one-to-one;
# the category count is fixed by the token schema, not by design drift.
max-attributes = 14
