[[IgnoredVulns]]
id = "GHSA-jmr9-qjv8-65gv"
ignoreUntil = 2026-11-02
reason = "extract-zip@2.0.1: advisory first_patched_version = none; npm latest remains 2.0.1. @lhci/cli@0.15.1 (npm latest) pins lighthouse@12.6.1 exactly, which requires puppeteer-core ^24.10.0; resolved puppeteer-core@24.43.1 pins @puppeteer/browsers@2.13.2 exactly. Extract-zip-free @puppeteer/browsers >=3.0.2 is ESM-only and requires Node >=22.12.0; reaching it here would require a risky cross-major override outside puppeteer-core 24's exact dependency. Dev-only via @lhci/cli -> lighthouse -> puppeteer-core -> @puppeteer/browsers; extracts Chrome-for-Testing downloads, not user archives. Malicious upstream archives could write outside the extraction directory; trusted download source limits exposure. Upstream: https://github.com/max-mapper/extract-zip"

